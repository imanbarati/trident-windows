name: Android APK release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default apk-v<Cargo.toml version>)"
        required: false
        type: string
  push:
    branches:
      - "main"
    tags:
      - "v*"
      - "apk-v*"

permissions:
  contents: write

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build and publish arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK and NDK
        run: |
          set -euo pipefail
          sdk="${RUNNER_TEMP}/android-sdk"
          mkdir -p "${sdk}/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mkdir -p "${sdk}/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools/* "${sdk}/cmdline-tools/latest/"
          export ANDROID_HOME="${sdk}"
          export ANDROID_SDK_ROOT="${sdk}"
          yes | "${sdk}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${sdk}" --licenses >/dev/null || true
          "${sdk}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${sdk}" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          ndk="${sdk}/ndk/27.2.12479018"
          test -x "${ndk}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          {
            echo "ANDROID_HOME=${sdk}"
            echo "ANDROID_SDK_ROOT=${sdk}"
            echo "ANDROID_NDK_ROOT=${ndk}"
            echo "ANDROID_NDK_HOME=${ndk}"
          } >> "${GITHUB_ENV}"
          echo "${sdk}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "${sdk}/platform-tools" >> "${GITHUB_PATH}"

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/egui

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked --version 0.10.0

      - name: Release keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64}" && -n "${KEYSTORE_PASS}" ]]; then
            echo "${KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/trident.keystore"
            alias="${KEYSTORE_ALIAS}"
            if [[ -z "${alias}" ]]; then
              alias="$(keytool -list -v -keystore "${RUNNER_TEMP}/trident.keystore" -storepass "${KEYSTORE_PASS}" 2>/dev/null | sed -n 's/^Alias name: //p' | head -1)"
            fi
            if [[ -z "${alias}" ]]; then
              echo "Could not determine the keystore alias. Set ANDROID_KEYSTORE_ALIAS." >&2
              exit 1
            fi
            keypass="${KEY_PASSWORD:-${KEYSTORE_PASS}}"
            echo "path=${RUNNER_TEMP}/trident.keystore" >> "$GITHUB_OUTPUT"
            echo "password=${KEYSTORE_PASS}" >> "$GITHUB_OUTPUT"
            echo "alias=${alias}" >> "$GITHUB_OUTPUT"
            echo "key_password=${keypass}" >> "$GITHUB_OUTPUT"
            echo "Release keystore loaded."
          else
            keytool -genkeypair -v \
              -keystore "${RUNNER_TEMP}/trident-debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Trident CI, OU=Trident, O=Trident, L=NA, ST=NA, C=US"
            echo "path=${RUNNER_TEMP}/trident-debug.keystore" >> "$GITHUB_OUTPUT"
            echo "password=android" >> "$GITHUB_OUTPUT"
            echo "alias=androiddebugkey" >> "$GITHUB_OUTPUT"
            echo "key_password=android" >> "$GITHUB_OUTPUT"
            echo "No Android keystore secrets — using a fresh debug signing key."
          fi

      - name: Build release APK
        working-directory: native/egui
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASS: ${{ steps.keystore.outputs.password }}
        run: |
          set -euo pipefail
          export CARGO_APK_RELEASE_KEYSTORE="${KEYSTORE_PATH}"
          export CARGO_APK_RELEASE_KEYSTORE_PASSWORD="${KEYSTORE_PASS}"
          cargo apk build --release --lib

      - name: Align, sign and verify APK
        working-directory: native/egui
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASS: ${{ steps.keystore.outputs.password }}
          KEY_ALIAS: ${{ steps.keystore.outputs.alias }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: |
          set -euo pipefail
          apk="target/release/apk/trident.apk"
          aligned="${RUNNER_TEMP}/trident-aligned.apk"
          apksigner="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          zipalign="${ANDROID_HOME}/build-tools/35.0.0/zipalign"
          test -f "${apk}"
          test -x "${apksigner}"
          test -x "${zipalign}"
          "${zipalign}" -P 16 -f 4 "${apk}" "${aligned}"
          mv "${aligned}" "${apk}"
          "${apksigner}" sign \
            --ks "${KEYSTORE_PATH}" \
            --ks-pass "pass:${KEYSTORE_PASS}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "${apk}"
          "${apksigner}" verify --verbose --print-certs "${apk}"

      - name: Stage APK
        id: apk
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="native/egui/target/release/apk/trident.apk"
          unaligned="native/egui/target/release/apk/trident-unaligned.apk"
          printf 'aligned APK: %s\n' "$apk"
          printf 'unaligned APK: %s\n' "$unaligned"
          test -f "$apk"
          test -s "$apk"
          cp "$apk" dist/trident-arm64.apk
          test -s dist/trident-arm64.apk
          echo "file=dist/trident-arm64.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trident-arm64
          path: dist/trident-arm64.apk
          if-no-files-found: error

      - name: Release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            name="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            name="${INPUT_TAG}"
          else
            ver="$(sed -n 's/^version = "\(.*\)"/\1/p' native/egui/Cargo.toml | head -1)"
            name="apk-v${ver}"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Trident ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/trident-arm64.apk
          body: |
            Native Trident picker for Android (arm64-v8a).

            This APK does not install agents. It shows the Termux command. Install Termux from F-Droid, then paste that command.

            Sideload `trident-arm64.apk`. Android will ask you to allow installs from the browser.

            Without `ANDROID_KEYSTORE_BASE64` and `ANDROID_KEYSTORE_PASSWORD` secrets, the APK is debug-signed. That is enough to sideload. It is not a Play Store signature.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
