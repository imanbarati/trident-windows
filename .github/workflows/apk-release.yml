name: Android APK release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default apk-v<Cargo.toml version>)"
        required: false
        type: string
  push:
    tags:
      - "v*"
      - "apk-v*"

permissions:
  contents: write

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build and publish arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/egui

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked --version 0.10.0

      - name: Optional release keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64}" && -n "${KEYSTORE_PASS}" ]]; then
            echo "${KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/trident.keystore"
            echo "path=${RUNNER_TEMP}/trident.keystore" >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_* secrets — cargo-apk will debug-sign the APK."
          fi

      - name: Build release APK
        working-directory: native/egui
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_PATH}" ]]; then
            export CARGO_APK_RELEASE_KEYSTORE="${KEYSTORE_PATH}"
            export CARGO_APK_RELEASE_KEYSTORE_PASSWORD="${KEYSTORE_PASS}"
          fi
          cargo apk build --release

      - name: Stage APK
        id: apk
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t apks < <(find native/egui/target -type f -name '*.apk' | sort)
          printf 'found:\n' 
          printf '  %s\n' "${apks[@]:-}"
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "cargo-apk produced no APK" >&2
            exit 1
          fi
          cp "${apks[0]}" dist/trident-arm64.apk
          echo "file=dist/trident-arm64.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trident-arm64
          path: dist/trident-arm64.apk
          if-no-files-found: error

      - name: Release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            name="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            name="${INPUT_TAG}"
          else
            ver="$(sed -n 's/^version = "\(.*\)"/\1/p' native/egui/Cargo.toml | head -1)"
            name="apk-v${ver}"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Trident ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/trident-arm64.apk
          body: |
            Native Trident picker for Android (arm64-v8a).

            This APK does not install agents. It shows the Termux command. Install Termux from F-Droid, then paste that command.

            Sideload `trident-arm64.apk`. Android will ask you to allow installs from the browser.

            Without `ANDROID_KEYSTORE_BASE64` and `ANDROID_KEYSTORE_PASSWORD` secrets, the APK is debug-signed. That is enough to sideload. It is not a Play Store signature.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
