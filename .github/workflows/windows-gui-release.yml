name: Windows GUI release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "native/egui/**"
      - ".github/workflows/windows-gui-release.yml"
      - "install.ps1"
      - "install.cmd"

permissions:
  contents: write

concurrency:
  group: windows-gui-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-gui:
    name: Build Windows GUI
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/egui

      - name: Build GUI
        working-directory: native/egui
        run: cargo build --release --bin trident-gui

      - name: Stage release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = "native/egui/target/release/trident-gui.exe"
          if (!(Test-Path $exe)) { throw "GUI executable was not produced: $exe" }
          Copy-Item $exe "dist/trident-gui-windows-x64.exe"
          Compress-Archive -Path "dist/trident-gui-windows-x64.exe" -DestinationPath "dist/trident-gui-windows-x64.zip" -Force

      - name: Upload Windows GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: trident-gui-windows-x64
          path: |
            dist/trident-gui-windows-x64.exe
            dist/trident-gui-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: Trident Windows build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/trident-gui-windows-x64.exe
            dist/trident-gui-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
