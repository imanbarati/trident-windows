[package]
name = "trident-gui"
version = "1.2.0"
edition = "2021"
license = "MIT"
description = "Trident native setup GUI (eframe / egui) for Windows and Android"
repository = "https://github.com/imanbarati/trident-windows"
publish = false

[dependencies]
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "glow",
    "android-native-activity",
] }
egui = "0.32"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
jni = "0.22"

[lib]
name = "trident_gui"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "trident-gui"
path = "src/main.rs"

# cargo-apk reads this. arm64 only — that is the phone ABI install.sh supports.
[package.metadata.android]
package = "app.trident.setup"
apk_name = "trident"
build_targets = ["aarch64-linux-android"]
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 35
